  - Localization/uk.lproj
  - Localization/de.lproj
  - Localization/es.lproj
  - Localization/fr.lproj
  - Localization/it.lproj
  - Localization/pt-BR.lproj
  - Localization/zh-Hans.lproj
  - Localization/ja.lproj
